name: tls13-key-share
domain: long-doc
tags:
- rfc
- tls
question: In TLS 1.3 (RFC 8446), what is the key_share extension's role in the handshake, and what does the server do if it supports none of the groups for which the client sent key shares?
expected:
- key_share carries the client's/server's (EC)DHE public key(s) for the key exchange, one per named group
- If no offered key share matches, the server sends a HelloRetryRequest naming a group from the client's supported_groups, and the client sends a new ClientHello with a key share for it
